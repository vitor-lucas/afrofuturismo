<title>Vila Afrofuturista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #EFE6D4;
    --ink: #241A12;
    --ink2: #5B4B3C;
    --panel: rgba(252, 247, 236, .94);
    --panel2: #F3EAD7;
    --line: rgba(36, 26, 18, .16);
    --gold: #C98A12;
    --gold2: #E8B23A;
    --teal: #17877D;
    --clay: #B4502D;
    --leaf: #3F7A55;
    --indigo: #4A5BA8;
    --plum: #8A3C93;
    --rose: #B8326A;
    --on-gold: #2A1B05;
    --shadow: 0 18px 50px rgba(30, 18, 6, .28);
    --gutter: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
    --f-head: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --f-body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  }

  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15100B;
      --ink: #F6EEDD;
      --ink2: #C9B9A1;
      --panel: rgba(26, 19, 13, .93);
      --panel2: #241A12;
      --line: rgba(246, 238, 221, .17);
      --gold: #E8B23A;
      --gold2: #F0C25A;
      --teal: #46C9BC;
      --clay: #E08359;
      --leaf: #7FC498;
      --indigo: #8C9CE8;
      --plum: #C98AD6;
      --rose: #F08AB0;
      --on-gold: #2A1B05;
      --shadow: 0 18px 50px rgba(0, 0, 0, .55);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15100B;
    --ink: #F6EEDD;
    --ink2: #C9B9A1;
    --panel: rgba(26, 19, 13, .93);
    --panel2: #241A12;
    --line: rgba(246, 238, 221, .17);
    --gold: #E8B23A;
    --gold2: #F0C25A;
    --teal: #46C9BC;
    --clay: #E08359;
    --leaf: #7FC498;
    --indigo: #8C9CE8;
    --plum: #C98AD6;
    --rose: #F08AB0;
    --on-gold: #2A1B05;
    --shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }

  * {
    box-sizing: border-box
  }

  html,
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body)
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 320px;
    overflow: hidden;
    overflow: clip;
    background: #0d0a07;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none
  }

  #c {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    cursor: grab
  }

  #c.fp {
    cursor: crosshair
  }

  #c.pick {
    cursor: pointer
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: .5em;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 999px;
    padding: .55em 1em;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.1;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .15s, background .15s
  }

  .btn:hover {
    transform: translateY(-1px);
    background: var(--panel2)
  }

  .btn:focus-visible,
  .tab:focus-visible,
  .chip:focus-visible,
  .term:focus-visible {
    outline: 3px solid var(--gold2);
    outline-offset: 2px
  }

  .btn.primary {
    background: var(--gold2);
    color: var(--on-gold);
    border-color: transparent
  }

  .btn.primary:hover {
    background: var(--gold2);
    filter: brightness(1.06)
  }

  .btn.ghost {
    background: transparent
  }

  .btn.sm {
    padding: .4em .8em;
    font-size: 13px
  }

  .btn[disabled] {
    opacity: .45;
    pointer-events: none
  }

  .ico {
    width: 1.15em;
    height: 1.15em;
    flex: none;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round
  }

  .hidden {
    display: none !important
  }

  /* HUD */
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none
  }

  #hud>* {
    pointer-events: auto
  }

  #top {
    position: absolute;
    top: 12px;
    left: var(--gutter);
    right: var(--gutter);
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none
  }

  #top>* {
    pointer-events: auto
  }

  #where {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 14px;
    max-width: min(520px, 60vw);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px)
  }

  #where small {
    display: block;
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink2);
    font-weight: 600
  }

  #where b {
    font-family: var(--f-head);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
    display: block
  }

  #tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end
  }

  #help {
    position: absolute;
    left: var(--gutter);
    bottom: 14px;
    max-width: min(430px, 70vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink2);
    line-height: 1.6;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px)
  }

  #help kbd {
    font: 600 12px var(--f-body);
    background: var(--panel2);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 6px;
    color: var(--ink)
  }

  #prompt {
    position: absolute;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    background: var(--gold2);
    color: var(--on-gold);
    border-radius: 999px;
    padding: .6em 1.2em;
    font-weight: 700;
    font-size: 15px;
    box-shadow: var(--shadow);
    pointer-events: none !important;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis
  }

  #cross {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .85);
    box-shadow: 0 0 0 2px rgba(0, 0, 0, .45);
    pointer-events: none !important
  }

  #mini {
    position: absolute;
    right: var(--gutter);
    bottom: 14px;
    width: 176px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px)
  }

  #mini canvas {
    width: 100%;
    display: block;
    border-radius: 9px;
    background: #120d08
  }

  #mini small {
    display: block;
    text-align: center;
    font-size: 11px;
    color: var(--ink2);
    padding: 3px 0 0;
    font-weight: 600
  }

  #progress {
    position: absolute;
    right: var(--gutter);
    bottom: 226px;
    font-size: 12px;
    font-weight: 600;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--ink2)
  }

  #labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden
  }

  .lbl {
    position: absolute;
    transform: translate(-50%, -100%);
    background: rgba(20, 14, 9, .78);
    color: #F6EEDD;
    border: 1px solid rgba(232, 178, 58, .55);
    border-radius: 8px;
    padding: 3px 8px;
    font: 600 12px var(--f-body);
    white-space: nowrap;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity .15s
  }

  .lbl:hover,
  .lbl.on {
    background: var(--gold2);
    color: var(--on-gold)
  }

  /* cartão rápido */
  #card {
    position: absolute;
    left: var(--gutter);
    bottom: 14px;
    width: min(400px, calc(100vw - 2*var(--gutter)));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 16px 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px)
  }

  #card h3 {
    margin: 2px 0 2px;
    font: 800 21px/1.15 var(--f-head)
  }

  #card .sub {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink2);
    font-weight: 600
  }

  #card p {
    margin: 8px 0 10px;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink)
  }

  #card .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap
  }

  .x {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    display: grid;
    place-items: center
  }

  /* selos */
  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 6px 0
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: 700 11.5px var(--f-body);
    border-radius: 999px;
    padding: 3px 9px 3px 7px;
    border: 1.5px solid currentColor;
    background: transparent;
    letter-spacing: .01em
  }

  .badge i {
    font-style: normal;
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: currentColor;
    font-size: 10px
  }

  .badge i b {
    color: var(--panel2);
    font-weight: 800
  }

  .badge.F {
    color: var(--teal)
  }

  .badge.R {
    color: var(--clay)
  }

  .badge.A {
    color: var(--indigo)
  }

  .badge.P {
    color: var(--plum)
  }

  .badge.X {
    color: var(--rose)
  }

  /* painel detalhado */
  #panel {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(470px, 100vw);
    background: var(--panel);
    border-left: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transform: translateX(0);
    transition: transform .25s
  }

  #panel.off {
    transform: translateX(105%)
  }

  #panel header {
    padding: 18px 54px 10px 20px;
    border-bottom: 1px solid var(--line)
  }

  #panel h2 {
    margin: 0;
    font: 800 25px/1.15 var(--f-head)
  }

  #panel .sub {
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink2);
    font-weight: 600
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 8px 14px 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto
  }

  .tab {
    border: 0;
    background: transparent;
    padding: 9px 12px;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink2);
    border-bottom: 3px solid transparent;
    white-space: nowrap
  }

  .tab[aria-selected=true] {
    color: var(--ink);
    border-bottom-color: var(--gold2)
  }

  #pbody {
    flex: 1;
    overflow: auto;
    padding: 14px 20px 28px;
    font-size: 15px;
    line-height: 1.6;
    user-select: text;
    -webkit-user-select: text;
    touch-action: pan-y
  }

  #pbody h4 {
    margin: 18px 0 4px;
    font: 700 13px var(--f-body);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--gold)
  }

  #pbody p {
    margin: 0 0 8px
  }

  #pbody .quick {
    font-size: 16.5px;
    font-weight: 500;
    padding: 12px 14px;
    background: var(--panel2);
    border-radius: 12px;
    border: 1px solid var(--line)
  }

  details {
    border: 1px solid var(--line);
    border-radius: 12px;
    margin: 8px 0;
    background: var(--panel2)
  }

  summary {
    cursor: pointer;
    padding: 10px 14px;
    font-weight: 700;
    list-style: none;
    display: flex;
    justify-content: space-between;
    gap: 10px
  }

  summary::-webkit-details-marker {
    display: none
  }

  summary::after {
    content: "+";
    font-weight: 700;
    color: var(--gold)
  }

  details[open] summary::after {
    content: "–"
  }

  details>div {
    padding: 0 14px 12px
  }

  .term {
    display: inline;
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    font-weight: 600;
    color: var(--teal);
    text-decoration: underline dotted;
    text-underline-offset: 3px;
    cursor: pointer
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px
  }

  .chip {
    border: 1px solid var(--line);
    background: var(--panel2);
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 13px;
    font-weight: 600
  }

  .ask {
    border-left: 4px solid var(--gold2);
    padding: 8px 12px;
    margin: 8px 0;
    background: var(--panel2);
    border-radius: 0 10px 10px 0;
    font-weight: 500
  }

  .src {
    font-size: 13.5px;
    color: var(--ink2)
  }

  .src li {
    margin: 5px 0
  }

  /* modais */
  #modal {
    position: absolute;
    inset: 0;
    background: rgba(10, 6, 3, .55);
    display: grid;
    place-items: center;
    padding: var(--gutter);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px)
  }

  #mbox {
    position: relative;
    width: min(880px, 100%);
    max-height: min(86vh, 100%);
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 26px 26px;
    box-shadow: var(--shadow);
    user-select: text;
    -webkit-user-select: text;
    touch-action: pan-y
  }

  #mbox h2 {
    margin: 0 0 6px;
    font: 800 28px/1.15 var(--f-head)
  }

  #mbox p {
    line-height: 1.6;
    font-size: 15.5px
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px
  }

  .gl {
    border: 1px solid var(--line);
    background: var(--panel2);
    border-radius: 12px;
    padding: 10px 12px;
    text-align: left
  }

  .gl b {
    display: block;
    font-family: var(--f-head);
    font-size: 16px
  }

  .search {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--ink);
    border-radius: 12px;
    padding: 11px 14px;
    font: inherit;
    margin: 8px 0 12px
  }

  .pill4 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin: 12px 0
  }

  .pill4>div {
    border: 1px solid var(--line);
    background: var(--panel2);
    border-radius: 14px;
    padding: 12px 14px
  }

  .pill4 b {
    font: 800 16px var(--f-head);
    display: block;
    margin-bottom: 3px
  }

  table.leg {
    border-collapse: collapse;
    width: 100%;
    font-size: 14px
  }

  table.leg td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top
  }

  #mapc {
    width: 100%;
    aspect-ratio: 1/1;
    max-height: 60vh;
    border-radius: 14px;
    background: #120d08;
    display: block;
    cursor: pointer
  }

  .maprow {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 16px
  }

  @media(max-width:760px) {
    .maprow {
      grid-template-columns: 1fr
    }
  }

  .list button {
    display: flex;
    width: 100%;
    gap: 10px;
    text-align: left;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 8px 4px;
    font-size: 14px
  }

  .list button:hover {
    background: var(--panel2)
  }

  .list i {
    font-style: normal;
    font-weight: 800;
    color: var(--gold);
    min-width: 1.6em
  }

  /* início */
  #start {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    padding: var(--gutter);
    background: radial-gradient(120% 90% at 20% 100%, rgba(15, 9, 4, .92), rgba(15, 9, 4, .35) 60%, rgba(15, 9, 4, .1));
    color: #F6EEDD;
    overflow: auto
  }

  #start .in {
    width: 100%;
    max-width: 640px;
    padding: 20px 0 24px;
    margin-top: auto
  }

  #start .kick {
    display: inline-block;
    font: 700 12px var(--f-body);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #F2C45A;
    background: rgba(15, 9, 4, .6);
    padding: 5px 11px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px)
  }

  #start h1 {
    font: 800 clamp(38px, 8vw, 76px)/.98 var(--f-head);
    margin: 8px 0 12px;
    letter-spacing: -.02em
  }

  #start p {
    font-size: clamp(15px, 2.2vw, 18px);
    line-height: 1.55;
    color: #E8DCC6;
    margin: 0 0 18px;
    max-width: 560px
  }

  #start .btns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    max-width: 640px
  }

  #start .btn {
    justify-content: flex-start;
    padding: .85em 1.1em;
    font-size: 15px;
    background: rgba(246, 238, 221, .12);
    color: #F6EEDD;
    border-color: rgba(246, 238, 221, .3)
  }

  #start .btn.primary {
    background: #E8B23A;
    color: #2A1B05
  }

  #start .fine {
    margin-top: 16px;
    font-size: 12.5px;
    color: #C9B9A1;
    max-width: 560px
  }

  /* visita guiada */
  #tour {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: min(640px, calc(100vw - 2*var(--gutter)));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px)
  }

  #tour .st {
    font: 700 12px var(--f-body);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--gold)
  }

  #tour h3 {
    margin: 2px 0 4px;
    font: 800 22px/1.15 var(--f-head)
  }

  #tour p {
    margin: 6px 0;
    font-size: 15px;
    line-height: 1.55
  }

  #tour .dots {
    display: flex;
    gap: 5px;
    margin: 8px 0
  }

  #tour .dots i {
    height: 5px;
    flex: 1;
    border-radius: 3px;
    background: var(--line)
  }

  #tour .dots i.on {
    background: var(--gold2)
  }

  /* diversos */
  #fade {
    position: absolute;
    inset: 0;
    background: #0b0805;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s
  }

  #fade.on {
    opacity: 1;
    pointer-events: auto
  }

  #load,
  #err {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #120d08;
    color: #F6EEDD;
    text-align: center;
    padding: 24px;
    z-index: 50
  }

  #load b {
    font: 800 26px var(--f-head);
    display: block;
    margin-bottom: 10px
  }

  #load .bar {
    width: min(320px, 70vw);
    height: 6px;
    border-radius: 3px;
    background: rgba(246, 238, 221, .16);
    margin: 14px auto 0;
    overflow: hidden
  }

  #load .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: #E8B23A;
    transition: width .2s
  }

  #toast {
    position: absolute;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    background: var(--ink);
